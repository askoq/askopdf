name: Desktop builds

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-builds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.35.7

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build application
        run: flutter build windows --release --no-pub

      - name: Package application
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "AskoPDF-windows-x64.zip"

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          path: AskoPDF-windows-x64.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build application
        run: flutter build linux --release --no-pub

      - name: Package application
        run: tar -czf AskoPDF-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux build
        uses: actions/upload-artifact@v7
        with:
          path: AskoPDF-linux-x64.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ARM64
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: arm64
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build application
        run: flutter build macos --release --no-pub

      - name: Package application
        run: ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/asko_pdf.app" "AskoPDF-macos-arm64.zip"

      - name: Upload macOS build
        uses: actions/upload-artifact@v7
        with:
          path: AskoPDF-macos-arm64.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
